# Atualiza assets/dados/selic.json com a Selic diária do Banco Central, usada para corrigir a
# dívida do Grêmio na Transparência. É só um agendador: todo o trabalho está em
# ferramentas/selic.mjs, que roda igual em qualquer servidor com Node.
name: Selic

on:
  schedule:
    # 9h10 em São Paulo (UTC 12h10), dias úteis: o Banco Central publica a taxa do dia anterior cedo.
    - cron: "10 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados-do-site
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node ferramentas/selic.mjs
      - name: Publicar se mudou
        run: |
          if git diff --quiet -- assets/dados/selic.json; then
            echo "Sem mudanças na Selic."
            exit 0
          fi
          git config user.name "selic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dados/selic.json
          git commit -m "Atualiza a Selic (Banco Central)"
          git pull --rebase origin main
          git push
